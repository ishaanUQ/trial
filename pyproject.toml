[project]
name = "mergesort-demo"
version = "0.1.0"
description = "Full-stack merge sort demo: FastAPI backend, Streamlit frontend."
requires-python = ">=3.12"

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["backend"]
