name: docker

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend
        run: docker build -t mergesort-backend ./backend

      - name: Build frontend
        run: docker build -t mergesort-frontend ./frontend
